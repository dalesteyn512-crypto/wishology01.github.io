<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishology — 4D Creative Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; background: #ffe4ec; color: #5c1626; }
    .font-brand { font-family: 'Dancing Script', cursive; }
    .wish-card { background: #fff2f6; border: 1.5px solid #f4a5be; box-shadow: 0 10px 28px rgba(214,92,134,.16); }
    canvas.three-stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script>
    const esc = (s="") => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    const uid = (p="id") => p + "_" + Math.random().toString(36).slice(2,8);
    const clone = (o) => JSON.parse(JSON.stringify(o));

    const svgSample = (lbl, c1, c2) => "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect width="420" height="300" fill="url(#g)"/><circle cx="210" cy="115" r="46" fill="rgba(255,255,255,0.25)"/><text x="210" y="215" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22" font-weight="bold">${lbl}</text></svg>`
    );

    const SAMPLES = [
      { id:"sp1", url:svgSample("Memory Photo 1","#f06292","#ba68c8"), caption:"A smile worth celebrating" },
      { id:"sp2", url:svgSample("Memory Photo 2","#ec407a","#ffb74d"), caption:"Moments we treasure forever" },
      { id:"sp3", url:svgSample("Memory Photo 3","#ab47bc","#4fc3f7"), caption:"Pure joy together" },
      { id:"sp4", url:svgSample("Memory Photo 4","#e57373","#f06292"), caption:"Forever in our hearts" }
    ];

    const fx4D = {
      timer: null, ctx: null,
      ensure() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
        return this.ctx;
      },
      playMusic() {
        this.stopMusic();
        try {
          const ctx = this.ensure(), n = [523.25,659.25,783.99,659.25,587.33,698.46,880,698.46]; let k = 0;
          const t = () => {
            if (!this.ctx) return;
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = "sine"; o.frequency.value = n[k++ % n.length];
            g.gain.setValueAtTime(0.045, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
            o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.6);
          };
          t(); this.timer = setInterval(t, 650);
        } catch(e){}
      },
      chime() {
        try { if (navigator.vibrate) navigator.vibrate([35,30,70]); } catch(e){}
        try {
          const ctx = this.ensure();
          [659.25,783.99,1046.5,1318.5].forEach((f,i) => {
            const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + i*0.065;
            o.type = "triangle"; o.frequency.value = f;
            g.gain.setValueAtTime(0.08, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
            o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.38);
          });
        } catch(e){}
      },
      stopMusic() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
    };

    class Wish4DEngine {
      constructor() {
        this.renderer = null; this.scene = null; this.camera = null; this.raf = null; this.clock = null;
        this.group = null; this.particles = null; this.halo = null;
        this.mode = "sprinkles_3d"; this.triggered = false; this.time = 0; this.burst = 0;
        this.refs = {}; this.rotY = 0; this.targetRotY = 0; this.dragging = false; this.lastX = 0;
      }
      sparkTex() {
        const c = document.createElement("canvas"); c.width = 64; c.height = 64;
        const ctx = c.getContext("2d"), g = ctx.createRadialGradient(32,32,1,32,32,30);
        g.addColorStop(0,"#fff"); g.addColorStop(0.35,"rgba(255,215,235,.95)"); g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
      }
      heartShape(s=1) {
        const sh = new THREE.Shape();
        sh.moveTo(0, 0.35*s);
        sh.bezierCurveTo(0,0.78*s,-0.62*s,0.78*s,-0.62*s,0.25*s);
        sh.bezierCurveTo(-0.62*s,-0.22*s,0,-0.52*s,0,-0.82*s);
        sh.bezierCurveTo(0,-0.52*s,0.62*s,-0.22*s,0.62*s,0.25*s);
        sh.bezierCurveTo(0.62*s,0.78*s,0,0.78*s,0,0.35*s);
        return sh;
      }
      mount(container, mode, triggered, photos=[]) {
        if (!container) return;
        if (typeof THREE === "undefined") {
          container.innerHTML = `<div class="h-full flex items-center justify-center p-4 text-xs font-bold opacity-75">Connect to internet to load 4D animations ✨</div>`;
          return;
        }
        if (!this.clock) this.clock = new THREE.Clock();
        this.mode = mode || "sprinkles_3d"; this.triggered = !!triggered; this.burst = triggered ? 2.0 : 0.2;
        if (!this.renderer) {
          this.renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
          this.renderer.domElement.className = "three-stage";
          this.renderer.domElement.addEventListener("pointerdown", e => { this.dragging=true; this.lastX=e.clientX; });
          window.addEventListener("pointerup", () => this.dragging=false);
          window.addEventListener("pointermove", e => { if(this.dragging){ this.targetRotY+=(e.clientX-this.lastX)*0.015; this.lastX=e.clientX; } });
        }
        if (this.renderer.domElement.parentNode !== container) { container.innerHTML=""; container.appendChild(this.renderer.domElement); }
        const w = container.clientWidth||320, h = container.clientHeight||250;
        this.renderer.setSize(w, h, false);
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(44, w/h, 0.1, 100);
        this.camera.position.set(0, 0.65, 5.0);
        this.scene.add(new THREE.HemisphereLight(0xfff5f8, 0xf8bbd0, 1.0));
        const kl = new THREE.DirectionalLight(0xfff6e5, 1.2); kl.position.set(3,5,4);
        const rl = new THREE.PointLight(0xff66a3, 1.4, 16); rl.position.set(-3,2,3);
        this.scene.add(kl, rl);
        this.group = new THREE.Group(); this.scene.add(this.group);
        this.halo = new THREE.Mesh(new THREE.TorusGeometry(1.45,0.025,12,64), new THREE.MeshBasicMaterial({color:0xffd54f,transparent:true,opacity:0.45}));
        this.halo.rotation.x = Math.PI/2; this.halo.position.y = -0.85; this.scene.add(this.halo);
        this.refs = {}; this.rotY = 0; this.targetRotY = 0; this.clock.getDelta();
        this.buildScene(photos);
        this.buildSprinkles(this.mode === "flower_sprinkles_3d" ? "flowers" : "sprinkles");
        if (this.raf) cancelAnimationFrame(this.raf);
        const loop = () => { this.raf = requestAnimationFrame(loop); this.update(Math.min(this.clock.getDelta(), 0.05)); this.renderer.render(this.scene, this.camera); };
        loop();
      }
      buildSprinkles(style) {
        const count = 320, pos = new Float32Array(count*3), cols = new Float32Array(count*3), vel = [];
        const pal = style === "flowers"
          ? [new THREE.Color("#ff80ab"),new THREE.Color("#f48fb1"),new THREE.Color("#fff0f5"),new THREE.Color("#ffd54f")]
          : [new THREE.Color("#ffd54f"),new THREE.Color("#ff4081"),new THREE.Color("#7dd3fc"),new THREE.Color("#ffffff")];
        for (let i=0; i<count; i++) {
          pos[i*3]=(Math.random()-0.5)*8; pos[i*3+1]=(Math.random()-0.5)*6; pos[i*3+2]=(Math.random()-0.5)*5.5;
          const c = pal[i%pal.length]; cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b;
          vel.push({ vy:0.5+Math.random()*0.75, vx:(Math.random()-0.5)*0.3, phase:Math.random()*6.28 });
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos,3)); geo.setAttribute("color", new THREE.BufferAttribute(cols,3));
        this.particles = new THREE.Points(geo, new THREE.PointsMaterial({ size:style==="flowers"?0.26:0.21, map:this.sparkTex(), vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
        this.refs.pVel = vel; this.scene.add(this.particles);
      }
      buildScene(photos) {
        const g = this.group, m = this.mode;
        const gold = new THREE.MeshStandardMaterial({color:0xffca28,metalness:0.68,roughness:0.2});
        const pink = new THREE.MeshStandardMaterial({color:0xf06292,roughness:0.28,metalness:0.08});
        const rose = new THREE.MeshStandardMaterial({color:0xe11d48,roughness:0.25,emissive:0x4c0519});
        const cream = new THREE.MeshStandardMaterial({color:0xfff9f0,roughness:0.32});
        const leafMat = new THREE.MeshStandardMaterial({color:0x22c55e,roughness:0.42});

        if (m==="sprinkles_3d" || m==="flower_sprinkles_3d") {
          const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.62,1), gold);
          const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15,0.04,16,48), gold); ring.rotation.x = 0.7;
          this.refs.orbRing = ring; g.add(core, ring);
          for (let i=0; i<12; i++) {
            const a=(i/12)*Math.PI*2, pet=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,18), i%2?pink:rose);
            pet.scale.set(1.35,0.3,0.65); pet.position.set(Math.cos(a)*0.88, Math.sin(a*2)*0.1, Math.sin(a)*0.88); pet.rotation.y=-a; g.add(pet);
          }
        } else if (m==="cake_cutting_3d") {
          const cake = new THREE.Group();
          const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,0.08,40), cream); plate.position.y=-0.68;
          const t1 = new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.28,0.62,40), pink); t1.position.y=-0.34;
          const t2 = new THREE.Mesh(new THREE.CylinderGeometry(0.88,0.9,0.52,40), cream); t2.position.y=0.24;
          cake.add(plate, t1, t2);
          for (let i=0; i<14; i++) {
            const a=(i/14)*Math.PI*2, dot=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,14), cream);
            dot.position.set(Math.cos(a)*1.16,-0.02,Math.sin(a)*1.16); cake.add(dot);
            if(i%2===0){ const ch=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,12),rose); ch.position.set(Math.cos(a)*0.72,0.52,Math.sin(a)*0.72); cake.add(ch); }
          }
          const slice = new THREE.Group();
          const sl1 = new THREE.Mesh(new THREE.CylinderGeometry(1.27,1.3,0.64,16,1,false,0,0.58), new THREE.MeshStandardMaterial({color:0xff80ab,roughness:0.3})); sl1.position.y=-0.33;
          const sl2 = new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.92,0.54,16,1,false,0,0.58), cream); sl2.position.y=0.25;
          slice.add(sl1, sl2); this.refs.cakeSlice = slice; cake.add(slice);
          this.refs.flames = [];
          [[-0.36,0],[0,0.36],[0.36,0],[0,-0.36],[0,0]].forEach(([cx,cz]) => {
            const c=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.4,14), new THREE.MeshStandardMaterial({color:0x38bdf8})); c.position.set(cx,0.68,cz);
            const fl=new THREE.Mesh(new THREE.SphereGeometry(0.075,12,12), new THREE.MeshStandardMaterial({color:0xffeb3b,emissive:0xff9800,emissiveIntensity:2.3}));
            fl.scale.set(0.8,1.4,0.8); fl.position.set(cx,0.95,cz); this.refs.flames.push(fl); cake.add(c,fl);
          });
          const knife = new THREE.Group();
          const blade = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.22,1.15), new THREE.MeshStandardMaterial({color:0xf1f5f9,metalness:0.9,roughness:0.1}));
          const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.5,14), gold); handle.rotation.x=Math.PI/2; handle.position.z=0.8;
          knife.add(blade, handle); knife.position.set(0.28,1.35,0.48); this.refs.knife=knife; cake.add(knife); g.add(cake);
        } else if (m==="gift_open_3d") {
          const base = new THREE.Mesh(new THREE.BoxGeometry(1.4,1.05,1.4), rose);
          const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.22,1.08,1.44), gold), r2 = new THREE.Mesh(new THREE.BoxGeometry(1.44,1.08,0.22), gold);
          g.add(base, r1, r2);
          const lid = new THREE.Group(); lid.position.set(0,0.55,-0.72);
          const lBox = new THREE.Mesh(new THREE.BoxGeometry(1.52,0.24,1.52), pink); lBox.position.z=0.72;
          const bow = new THREE.Mesh(new THREE.TorusKnotGeometry(0.22,0.06,56,10), gold); bow.position.set(0,0.22,0.72);
          lid.add(lBox, bow); this.refs.giftLid=lid; g.add(lid);
          const gift = new THREE.Mesh(new THREE.ExtrudeGeometry(this.heartShape(0.7),{depth:0.25,bevelEnabled:true,bevelSize:0.06,bevelThickness:0.06}), gold);
          gift.position.set(0,-0.05,-0.1); this.refs.presentedGift=gift; g.add(gift);
        } else if (m==="heart_open_3d") {
          const leftH = new THREE.Mesh(new THREE.ExtrudeGeometry(this.heartShape(1.12),{depth:0.28,bevelEnabled:true,bevelSize:0.08,bevelThickness:0.08}), rose);
          const rightH = leftH.clone(); leftH.position.set(-0.1,0.1,0.02); rightH.position.set(0.1,0.1,-0.04);
          this.refs.heartL=leftH; this.refs.heartR=rightH;
          const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.45,0), gold); this.refs.heartGem=gem; g.add(leftH,rightH,gem);
        } else if (m==="bouquet_3d") {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(0.78,1.5,28,1,true), new THREE.MeshStandardMaterial({color:0xfff1f5,side:THREE.DoubleSide,roughness:0.4}));
          cone.rotation.x=Math.PI; cone.position.y=-0.58;
          const rib = new THREE.Mesh(new THREE.TorusGeometry(0.32,0.06,14,28), gold); rib.rotation.x=Math.PI/2; rib.position.y=-0.55;
          g.add(cone, rib); this.refs.roses=[];
          [[0,0.52,0],[-0.45,0.34,0.22],[0.45,0.34,0.22],[0,0.38,-0.42],[0.32,0.44,-0.22],[-0.32,0.44,-0.22]].forEach(([rx,ry,rz],i) => {
            const rg = new THREE.Group(), bud = new THREE.Mesh(new THREE.TorusKnotGeometry(0.2,0.08,48,10), i%2?rose:pink);
            const lf = new THREE.Mesh(new THREE.SphereGeometry(0.18,12,12), leafMat); lf.scale.set(1.4,0.25,0.7); lf.position.set(0,-0.18,0.15);
            rg.add(bud, lf); rg.position.set(rx,ry,rz); this.refs.roses.push({mesh:rg,base:new THREE.Vector3(rx,ry,rz)}); g.add(rg);
          });
        } else if (m==="hug_3d") {
          const skin = new THREE.MeshStandardMaterial({color:0xffdfc4,roughness:0.45}), eyeM = new THREE.MeshBasicMaterial({color:0x2d1020}), blM = new THREE.MeshBasicMaterial({color:0xff8da1});
          const mkBuddy = (col) => {
            const b = new THREE.Group(), coat = new THREE.MeshStandardMaterial({color:col,roughness:0.32});
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.38,0.85,24), coat); torso.position.y=-0.15;
            const neck = new THREE.Mesh(new THREE.SphereGeometry(0.28,20,20), coat); neck.position.y=0.26;
            const hg = new THREE.Group(); hg.position.y=0.64;
            const hd = new THREE.Mesh(new THREE.SphereGeometry(0.34,24,24), skin);
            const eL = new THREE.Mesh(new THREE.SphereGeometry(0.04,10,10), eyeM); eL.position.set(-0.11,0.04,0.31);
            const eR = eL.clone(); eR.position.x=0.11;
            const blL = new THREE.Mesh(new THREE.SphereGeometry(0.05,10,10), blM); blL.scale.set(1.2,0.7,0.4); blL.position.set(-0.18,-0.05,0.28);
            const blR = blL.clone(); blR.position.x=0.18; hg.add(hd,eL,eR,blL,blR);
            const mkA = (side) => {
              const p = new THREE.Group(); p.position.set(side*0.33,0.16,0.05);
              const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.62,14), coat); arm.rotation.x=Math.PI/2; arm.position.z=0.28;
              const hnd = new THREE.Mesh(new THREE.SphereGeometry(0.085,12,12), skin); hnd.position.z=0.58; p.add(arm,hnd); return p;
            };
            const armL=mkA(-1), armR=mkA(1); b.add(torso,neck,hg,armL,armR); b.userData={armL,armR,headGrp:hg}; return b;
          };
          const b1=mkBuddy(0xec407a), b2=mkBuddy(0x60a5fa); b1.position.set(-1.05,-0.05,0); b1.rotation.y=Math.PI/2; b2.position.set(1.05,-0.05,0); b2.rotation.y=-Math.PI/2;
          this.refs.hugHearts = [];
          const hGeo = new THREE.ExtrudeGeometry(this.heartShape(0.28),{depth:0.1,bevelEnabled:true,bevelSize:0.03,bevelThickness:0.03});
          for(let i=0;i<8;i++){ const hm=new THREE.Mesh(hGeo,i%2?rose:pink), ang=(i/8)*Math.PI*2; hm.position.set(Math.cos(ang)*0.6,0.9,Math.sin(ang)*0.6); this.refs.hugHearts.push({mesh:hm,phase:i*0.8}); g.add(hm); }
          this.refs.hug1=b1; this.refs.hug2=b2; g.add(b1,b2);
        } else if (m==="anniversary_3d") {
          const r1=new THREE.Mesh(new THREE.TorusGeometry(0.75,0.11,24,56),gold), r2=new THREE.Mesh(new THREE.TorusGeometry(0.75,0.11,24,56),gold);
          r1.position.x=-0.36; r1.rotation.y=0.55; r2.position.x=0.36; r2.rotation.y=-0.55; r2.rotation.x=0.8;
          g.add(r1,r2,new THREE.Mesh(new THREE.ExtrudeGeometry(this.heartShape(0.55),{depth:0.2,bevelEnabled:true,bevelSize:0.05,bevelThickness:0.05}),rose));
        } else if (m==="baby_welcome_3d") {
          const moon=new THREE.Mesh(new THREE.TorusGeometry(0.85,0.2,20,48,Math.PI*1.35),gold); moon.rotation.z=0.7;
          const star=new THREE.Mesh(new THREE.OctahedronGeometry(0.32,0),gold); star.position.set(0.3,0.2,0.2);
          [[-0.8,-0.55,0.2],[0,-0.65,0.3],[0.8,-0.5,0.1]].forEach(([cx,cy,cz])=>{ const cl=new THREE.Mesh(new THREE.SphereGeometry(0.36,18,18),cream); cl.position.set(cx,cy,cz); cl.scale.set(1.45,0.8,1); g.add(cl); });
          g.add(moon,star);
        } else if (m==="doors_3d") {
          const portal=new THREE.Mesh(new THREE.PlaneGeometry(1.7,2.1), new THREE.MeshBasicMaterial({color:0xfef08a})); portal.position.z=-0.15;
          const dL=new THREE.Group(); dL.position.set(-0.85,0,0); const mL=new THREE.Mesh(new THREE.BoxGeometry(0.84,2.1,0.1),pink); mL.position.x=0.42; dL.add(mL);
          const dR=new THREE.Group(); dR.position.set(0.85,0,0); const mR=new THREE.Mesh(new THREE.BoxGeometry(0.84,2.1,0.1),pink); mR.position.x=-0.42; dR.add(mR);
          this.refs.doorL=dL; this.refs.doorR=dR; g.add(portal,dL,dR);
        } else if (m==="photo_3d") {
          const list = photos.length ? photos : SAMPLES.slice(0,3), count = Math.max(list.length,3), rad = 1.48;
          for (let i=0; i<count; i++) {
            const p = list[i%list.length], frame = new THREE.Mesh(new THREE.BoxGeometry(1.18,0.96,0.06), cream), img = new Image();
            img.onload = () => {
              const tex = new THREE.Texture(img); tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false; tex.needsUpdate=true;
              const pic = new THREE.Mesh(new THREE.PlaneGeometry(1.04,0.82), new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})); pic.position.z=0.04;
              const back = pic.clone(); back.position.z=-0.04; back.rotation.y=Math.PI; frame.add(pic,back);
            };
            img.src = p.url;
            const ang = (i/count)*Math.PI*2; frame.position.set(Math.sin(ang)*rad, 0.06, Math.cos(ang)*rad); frame.rotation.y=ang; g.add(frame);
          }
        }
      }
      trigger() { this.triggered = true; this.burst = 2.4; }
      update(dt) {
        this.time += dt; const sm = 1 - Math.exp(-6 * dt);
        if (!this.dragging) this.targetRotY += (this.mode==="doors_3d"||this.mode==="hug_3d") ? 0 : dt*0.6;
        this.rotY += (this.targetRotY - this.rotY) * (1 - Math.exp(-10*dt));
        this.group.rotation.y = this.rotY; this.group.position.y = Math.sin(this.time*1.8)*0.07;
        this.camera.position.z += ((this.triggered?4.35:5.0) - this.camera.position.z) * (1 - Math.exp(-3.5*dt));
        if (this.halo) { this.halo.rotation.z += dt*0.8; this.halo.material.opacity = 0.35 + Math.sin(this.time*3)*0.15; }
        if (this.refs.orbRing) this.refs.orbRing.rotation.z += dt*1.4;
        if (this.mode==="cake_cutting_3d") {
          if (this.refs.knife) this.refs.knife.position.y += ((this.triggered?0.12:1.35) - this.refs.knife.position.y)*sm;

            ${app.step===3?`<div class="space-y-3"><div class="flex justify-between items-center"><h2 class="text-lg font-bold">Step 3: Questions (${qs.qaList.length})</h2><button onclick="app.addQAQuestion()" class="px-3 py-1.5 rounded-full bg-emerald-500 text-white text-xs font-bold">+ Add Question</button></div>
              <div class="space-y-3 max-h-[380px] overflow-y-auto">${qs.qaList.map((q,qi)=>`<div class="bg-white p-3.5 rounded-2xl border border-pink-300 space-y-2"><div class="flex justify-between"><span class="text-xs font-bold text-pink-600">Question ${qi+1}</span>${qs.qaList.length>1?`<button onclick="app.getQAScene().qaList.splice(${qi},1);render()" class="text-xs text-rose-600 font-bold">Delete</button>`:""}</div>
                <input value="${esc(q.prompt)}" oninput="app.getQAScene().qaList[${qi}].prompt=this.value;app.refreshPreviewOnly()" class="w-full p-2 rounded-xl border border-pink-200 text-xs font-semibold"/>
                ${q.choices.map((ch,ci)=>`<div class="flex gap-1.5"><input value="${esc(ch)}" oninput="app.getQAScene().qaList[${qi}].choices[${ci}]=this.value;app.refreshPreviewOnly()" class="flex-1 p-1.5 rounded-lg border border-pink-200 text-xs"/>${q.choices.length>2?`<button onclick="app.getQAScene().qaList[${qi}].choices.splice(${ci},1);render()" class="px-2 bg-rose-100 rounded-lg text-xs">✕</button>`:""}</div>`).join("")}
                <button onclick="app.getQAScene().qaList[${qi}].choices.push('New Choice');render()" class="text-[11px] font-bold text-pink-600">+ Add Choice</button>
                <div class="grid grid-cols-2 gap-2"><select onchange="app.getQAScene().qaList[${qi}].correctIdx=Number(this.value);app.refreshPreviewOnly()" class="p-1.5 rounded-lg border border-pink-200 text-[11px]"><option value="-1" ${q.correctIdx<0?'selected':''}>Any answer correct</option>${q.choices.map((_,ci)=>`<option value="${ci}" ${q.correctIdx===ci?'selected':''}>Correct: #${ci+1}</option>`).join("")}</select><input value="${esc(q.reply)}" oninput="app.getQAScene().qaList[${qi}].reply=this.value;app.refreshPreviewOnly()" class="p-1.5 rounded-lg border border-pink-200 text-[11px]"/></div></div>`).join("")}</div>
              <div class="flex justify-end"><button onclick="app.jumpToStep(4)" class="px-6 py-2 rounded-full bg-pink-500 text-white text-xs font-bold">Next: 4D Scenes →</button></div></div>`:""}

            ${app.step===4?`<div class="space-y-3"><div class="flex justify-between items-center"><h2 class="text-lg font-bold">Step 4: 4D Scenes</h2><button onclick="app.addScene('hug_3d')" class="px-3 py-1.5 rounded-full bg-pink-500 text-white text-xs font-bold">+ Add 4D Hug 🤗</button></div>
              <div class="space-y-1.5 max-h-36 overflow-y-auto">${p.scenes.map((scn,i)=>`<div onclick="app.selSceneIdx=${i};app.previewIdx=${i};app.previewStarted=true;render()" class="flex justify-between items-center p-2 rounded-xl border cursor-pointer ${i===app.selSceneIdx?'bg-pink-100 border-pink-500':'bg-white border-pink-200'}"><span class="text-xs font-bold">${i+1}. ${esc(scn.title)}</span><div class="flex gap-1"><button onclick="event.stopPropagation();app.moveScene(${i},-1)" class="px-2 bg-pink-200 rounded text-[11px]">↑</button><button onclick="event.stopPropagation();app.moveScene(${i},1)" class="px-2 bg-pink-200 rounded text-[11px]">↓</button><button onclick="event.stopPropagation();app.removeScene(${i})" class="px-2 bg-rose-200 rounded text-[11px]">✕</button></div></div>`).join("")}</div>
              <select onchange="app.addScene(this.value);this.value=''" class="w-full p-2 rounded-xl bg-white border border-pink-300 text-xs font-bold"><option value="">+ Add Any 4D Scene / Story / Q&amp;A...</option>${MODES_4D.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}<option value="story">📝 Story &amp; Wishes</option><option value="qa">❓ Interactive Q&amp;A</option></select>
              <div class="bg-white p-3 rounded-2xl border border-pink-200 space-y-2">${s.type==="3d_scene"?`<select onchange="app.setSceneField('mode3d',this.value)" class="w-full p-2 rounded-xl border border-pink-200 text-xs font-bold">${MODES_4D.map(([v,l])=>`<option value="${v}" ${s.mode3d===v?"selected":""}>${l}</option>`).join("")}</select>`:""}<input placeholder="Scene Headline" value="${esc(s.headline)}" oninput="app.setSceneField('headline',this.value)" class="w-full p-2 rounded-xl border border-pink-200 text-xs"/></div>
              <button onclick="app.jumpToStep(5)" class="w-full py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white text-sm font-bold">Finish &amp; Share Wish →</button></div>`:""}

            ${app.step===5?`<div class="space-y-3"><h2 class="text-xl font-bold text-center">🎉 Ready to Share With ${esc(p.vars.recipientName)}!</h2>
              <div class="bg-white p-4 rounded-2xl border-2 border-pink-300 space-y-2.5">
                <label class="block text-xs font-bold">Your Wishology Website URL:</label>
                <input value="${esc(app.wishologyBaseUrl)}" oninput="app.setWishologyUrl(this.value)" class="w-full p-2 rounded-xl bg-pink-50 border border-pink-200 text-xs font-semibold"/>
                <label class="block text-xs font-bold">Customer Shareable Blue Link:</label>
                <input id="share-link-input" readonly value="${esc(app.sharedLink)}" class="w-full p-2 rounded-xl bg-slate-50 border border-pink-200 text-[11px]"/>
                <div class="grid grid-cols-2 gap-2"><button onclick="app.shareWishNow()" class="py-3 rounded-full bg-gradient-to-r from-emerald-500 to-green-600 text-white text-xs font-bold shadow-lg">📤 Share Link (WhatsApp)</button><button onclick="app.copyShareLink()" class="py-3 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs font-bold shadow">📋 Copy Blue Link</button></div>
                <button onclick="app.openCustomerPreview()" class="w-full py-2 rounded-full bg-pink-100 text-[#5c1626] text-xs font-bold">👀 Fullscreen Preview (With Replay)</button>
              </div></div>`:""}
          </div>

          <div class="lg:col-span-5 flex flex-col items-center">
            <p class="text-xs font-bold uppercase text-[#7a2338] mb-2">📱 Live 4D Customer Preview</p>
            <div id="preview-stage" class="w-[330px] h-[590px] rounded-[2.2rem] overflow-hidden border-[6px] border-[#681729] shadow-2xl bg-white">${renderPlayerHTML(data,false)}</div>
          </div>
        </div>

        ${app.showShareModal?`<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><div class="wish-card rounded-3xl p-6 max-w-sm w-full text-center space-y-3">
          <h3 class="text-lg font-bold">Send Wishology Link</h3>
          <button onclick="app.sendWhatsApp();app.showShareModal=false;render()" class="w-full py-3 rounded-full bg-emerald-600 text-white font-bold text-sm shadow">💬 Send via WhatsApp / Business</button>
          <button onclick="app.copyShareLink();app.showShareModal=false;render()" class="w-full py-2.5 rounded-full bg-pink-500 text-white font-bold text-sm shadow">📋 Copy Blue Link</button>
          <button onclick="app.showShareModal=false;render()" class="text-xs font-bold text-pink-700">Cancel</button>
        </div></div>`:""}
      </div>`;
      mount4DIfNeeded(data, false);
    }
    render();
  </script>
</body>
</html>
